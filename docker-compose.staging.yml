version: '3.8'

services:
  # Backend API (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_ENV=staging
    container_name: mobi-backend-staging
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend-storage:/var/www/storage
      - backend-cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=staging
      - APP_DEBUG=true
      - APP_URL=https://api-staging.mobi.com.br
      - DB_HOST=postgres
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_CONNECTION=redis
      - BROADCAST_DRIVER=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
      - SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN}
    networks:
      - mobi-network
    depends_on:
      - postgres
      - redis

  # Queue Worker (Horizon)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobi-horizon-staging
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./backend:/var/www
      - backend-storage:/var/www/storage
    environment:
      - APP_ENV=staging
      - DB_HOST=postgres
      - REDIS_HOST=redis
    networks:
      - mobi-network
    depends_on:
      - backend
      - postgres
      - redis

  # WebSocket Server (Reverb)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobi-reverb-staging
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=staging
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    networks:
      - mobi-network
    depends_on:
      - backend

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mobi-postgres-staging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - mobi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: mobi-redis-staging
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    networks:
      - mobi-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mobi-nginx-staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/public
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - mobi-network
    depends_on:
      - backend

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: mobi-minio-staging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - mobi-network

networks:
  mobi-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  backend-storage:
    driver: local
  backend-cache:
    driver: local
