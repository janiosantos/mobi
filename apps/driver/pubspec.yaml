name: mobi_driver
description: MOBI Driver App - Ride-sharing platform for drivers
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages
  mobi_core:
    path: ../../packages/mobi_core

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Maps
  google_maps_flutter: ^2.5.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Utilities
  get_it: ^7.6.7
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
