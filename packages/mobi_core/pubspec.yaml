name: mobi_core
description: Shared core package for MOBI ride-sharing platform
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_annotation: ^4.8.1

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^4.0.0
  google_maps_flutter: ^2.5.3

  # Utilities
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  logger: ^2.0.2+1
  uuid: ^4.3.3
  crypto: ^3.0.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Permissions
  permission_handler: ^12.0.1
  http: ^1.6.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.3
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
