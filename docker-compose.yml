version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mobi-postgres
    environment:
      POSTGRES_DB: mobi
      POSTGRES_USER: mobi
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mobi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: mobi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mobi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=mobi
      - DB_USERNAME=mobi
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mobi-network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Laravel Horizon (Queue Worker)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobi-horizon
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=mobi
      - DB_USERNAME=mobi
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - backend
      - redis
    networks:
      - mobi-network
    command: php artisan horizon

  # Mailpit (Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: mobi-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mobi-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: mobi-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - mobi-network
    command: server /data --console-address ":9001"

networks:
  mobi-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  minio_data:
