name: Build - Android & iOS

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'
  XCODE_VERSION: '15.0'

jobs:
  # ============================================
  # Job 1: Build Android APK/AAB
  # ============================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 🔑 Decode keystore (Release only)
        if: matrix.build_type == 'release'
        working-directory: apps/mobi_passenger/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          fi

      - name: 🔨 Build APK (Debug)
        if: matrix.build_type == 'debug'
        working-directory: apps/mobi_passenger
        run: flutter build apk --debug --target-platform android-arm64

      - name: 🔨 Build APK (Release)
        if: matrix.build_type == 'release'
        working-directory: apps/mobi_passenger
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: 🔨 Build App Bundle (Release only)
        if: matrix.build_type == 'release'
        working-directory: apps/mobi_passenger
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.build_type }}
          path: |
            apps/mobi_passenger/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 📦 Upload AAB artifact (Release only)
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: |
            apps/mobi_passenger/build/app/outputs/bundle/release/*.aab
          retention-days: 90

      - name: 📊 Build summary
        run: |
          echo "## 📱 Android Build (${{ matrix.build_type }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ matrix.build_type }}" == "release" ]]; then
            echo "✅ AAB built successfully" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Job 2: Build iOS IPA
  # ============================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40

    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 📦 Install CocoaPods dependencies
        working-directory: apps/mobi_passenger/ios
        run: pod install

      - name: 🔑 Setup certificates (Release only)
        if: matrix.build_type == 'release'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            # Create temp keychain
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security set-keychain-settings -t 3600 -u build.keychain

            # Import certificate
            echo "$P12_BASE64" | base64 -d > certificate.p12
            security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

            # Import provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi

      - name: 🔨 Build iOS (Debug)
        if: matrix.build_type == 'debug'
        working-directory: apps/mobi_passenger
        run: flutter build ios --debug --no-codesign

      - name: 🔨 Build iOS (Release)
        if: matrix.build_type == 'release'
        working-directory: apps/mobi_passenger
        run: flutter build ios --release

      - name: 📦 Create IPA (Release only)
        if: matrix.build_type == 'release'
        working-directory: apps/mobi_passenger/ios
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload

      - name: 📦 Upload IPA artifact (Release only)
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: apps/mobi_passenger/ios/app-release.ipa
          retention-days: 90

      - name: 🧹 Cleanup keychain (Release only)
        if: matrix.build_type == 'release' && always()
        run: |
          security delete-keychain build.keychain || true

      - name: 📊 Build summary
        run: |
          echo "## 🍎 iOS Build (${{ matrix.build_type }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ iOS app built successfully" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 3: Build Web
  # ============================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 🔨 Build Web
        working-directory: apps/mobi_passenger
        run: flutter build web --release --web-renderer canvaskit

      - name: 📦 Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobi_passenger/build/web/
          retention-days: 30

      - name: 📊 Build summary
        run: |
          echo "## 🌐 Web Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Web app built successfully" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 4: Deploy to Firebase (Optional)
  # ============================================
  deploy-firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 📥 Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-debug
          path: ./artifacts/android

      - name: 🚀 Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: testers
          file: ./artifacts/android/app-debug.apk
          releaseNotes: |
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
