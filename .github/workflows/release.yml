name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # ============================================
  # Job 1: Create GitHub Release
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: .github/changelog-config.json
          toTag: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 Release v${{ steps.get_version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## 📦 Assets

            - Android APK
            - Android AAB
            - iOS IPA

            ## 📝 Installation

            Download the appropriate file for your platform and install.
          draft: false
          prerelease: false

  # ============================================
  # Job 2: Build & Upload Android
  # ============================================
  release-android:
    name: Release Android
    runs-on: ubuntu-latest
    needs: create-release
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 🔑 Decode keystore
        working-directory: apps/mobi_passenger/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks

      - name: 🔨 Build APK
        working-directory: apps/mobi_passenger
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: 🔨 Build App Bundle
        working-directory: apps/mobi_passenger
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: ✍️ Sign APK
        working-directory: apps/mobi_passenger
        run: |
          # APK is already signed during build

      - name: 📦 Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: apps/mobi_passenger/build/app/outputs/flutter-apk/app-release.apk
          asset_name: mobi-passenger-v${{ needs.create-release.outputs.version }}-android.apk
          asset_content_type: application/vnd.android.package-archive

      - name: 📦 Upload AAB to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: apps/mobi_passenger/build/app/outputs/bundle/release/app-release.aab
          asset_name: mobi-passenger-v${{ needs.create-release.outputs.version }}-android.aab
          asset_content_type: application/octet-stream

      - name: 🚀 Deploy to Google Play (Internal Track)
        uses: r0adkll/upload-google-play@v1
        if: secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mobi.passenger
          releaseFiles: apps/mobi_passenger/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # ============================================
  # Job 3: Build & Upload iOS
  # ============================================
  release-ios:
    name: Release iOS
    runs-on: macos-latest
    needs: create-release
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 📦 Install CocoaPods
        working-directory: apps/mobi_passenger/ios
        run: pod install

      - name: 🔑 Setup certificates
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "$P12_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          # Import provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: 🔨 Build iOS
        working-directory: apps/mobi_passenger
        run: flutter build ios --release --no-codesign

      - name: 📦 Create IPA
        working-directory: apps/mobi_passenger/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: 📦 Upload IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: apps/mobi_passenger/ios/build/mobi-passenger.ipa
          asset_name: mobi-passenger-v${{ needs.create-release.outputs.version }}-ios.ipa
          asset_content_type: application/octet-stream

      - name: 🚀 Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        if: secrets.APPSTORE_API_KEY_ID != ''
        with:
          app-path: apps/mobi_passenger/ios/build/mobi-passenger.ipa
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 🧹 Cleanup
        if: always()
        run: security delete-keychain build.keychain || true

  # ============================================
  # Job 4: Notify
  # ============================================
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [release-android, release-ios]
    if: always()

    steps:
      - name: 📧 Send notification
        run: |
          echo "Release v${{ needs.create-release.outputs.version }} completed!"
          echo "Android: ${{ needs.release-android.result }}"
          echo "iOS: ${{ needs.release-ios.result }}"

      - name: 📊 Release summary
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **v${{ needs.create-release.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.release-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.release-ios.result }} |" >> $GITHUB_STEP_SUMMARY
