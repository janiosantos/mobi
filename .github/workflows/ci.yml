name: CI - Tests & Analysis

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # ============================================
  # Job 1: Analyze Code Quality
  # ============================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies - Backend
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 📦 Install dependencies - mobi_core
        working-directory: packages/mobi_core
        run: flutter pub get

      - name: 📦 Install dependencies - mobi_passenger
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 🔍 Run Flutter analyze - mobi_core
        working-directory: packages/mobi_core
        run: flutter analyze --no-fatal-infos

      - name: 🔍 Run Flutter analyze - mobi_passenger
        working-directory: apps/mobi_passenger
        run: flutter analyze --no-fatal-infos

      - name: 🔍 Run Dart analyze - Backend
        working-directory: backend
        run: |
          if [ -f "vendor/bin/phpstan" ]; then
            vendor/bin/phpstan analyse app --level=5 --no-progress || true
          fi

      - name: ✅ Check formatting - mobi_core
        working-directory: packages/mobi_core
        run: dart format --set-exit-if-changed lib test

      - name: ✅ Check formatting - mobi_passenger
        working-directory: apps/mobi_passenger
        run: dart format --set-exit-if-changed lib test

  # ============================================
  # Job 2: Unit Tests - mobi_core
  # ============================================
  test-core:
    name: Unit Tests - mobi_core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: packages/mobi_core
        run: flutter pub get

      - name: 🧪 Run unit tests
        working-directory: packages/mobi_core
        run: flutter test --coverage --reporter expanded

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: packages/mobi_core/coverage/lcov.info
          flags: mobi_core
          name: mobi-core-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📈 Generate coverage report
        working-directory: packages/mobi_core
        run: |
          flutter pub global activate coverage
          flutter pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib \
            --check-ignore

      - name: 💾 Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mobi-core
          path: packages/mobi_core/coverage/
          retention-days: 30

  # ============================================
  # Job 3: Backend Tests (Laravel)
  # ============================================
  test-backend:
    name: Backend Tests - Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mobi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip
          coverage: xdebug

      - name: 📦 Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 📝 Copy .env.testing
        working-directory: backend
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: 🗃️ Run migrations
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mobi_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --env=testing --force

      - name: 🧪 Run PHPUnit tests
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mobi_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
          else
            echo "PHPUnit not found, skipping tests"
          fi

      - name: 📊 Upload backend coverage
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # Job 4: Integration Tests (E2E)
  # ============================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 🧪 Run integration tests
        working-directory: apps/mobi_passenger
        run: |
          if [ -d "integration_test" ]; then
            flutter test integration_test
          else
            echo "No integration tests found, skipping"
          fi

  # ============================================
  # Job 5: Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔒 Run dependency audit - Backend
        working-directory: backend
        run: |
          if [ -f "composer.lock" ]; then
            composer audit || true
          fi

      - name: 🔒 Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ============================================
  # Job 6: Quality Gate
  # ============================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [analyze, test-core, test-backend]
    if: always()

    steps:
      - name: ✅ Check job results
        run: |
          echo "Analyze: ${{ needs.analyze.result }}"
          echo "Test Core: ${{ needs.test-core.result }}"
          echo "Test Backend: ${{ needs.test-backend.result }}"

          if [[ "${{ needs.analyze.result }}" != "success" ]]; then
            echo "❌ Code analysis failed"
            exit 1
          fi

          if [[ "${{ needs.test-core.result }}" != "success" ]]; then
            echo "❌ Core tests failed"
            exit 1
          fi

          if [[ "${{ needs.test-backend.result }}" != "success" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi

          echo "✅ All quality checks passed!"

      - name: 📊 Summary
        run: |
          echo "## ✅ CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Analysis | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Core) | ${{ needs.test-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
