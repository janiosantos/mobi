name: Flutter CI

on:
  push:
    branches: [ main, develop, staging ]
    paths:
      - 'apps/passenger/**'
      - 'apps/driver/**'
      - 'packages/mobi_core/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'packages/**'

jobs:
  analyze-passenger:
    name: Analyze Passenger App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies - mobi_core
        run: flutter pub get
        working-directory: ./packages/mobi_core

      - name: Get dependencies - passenger
        run: flutter pub get
        working-directory: ./apps/passenger

      - name: Run analyzer
        run: flutter analyze
        working-directory: ./apps/passenger

      - name: Check formatting
        run: dart format --set-exit-if-changed .
        working-directory: ./apps/passenger

  analyze-driver:
    name: Analyze Driver App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies - mobi_core
        run: flutter pub get
        working-directory: ./packages/mobi_core

      - name: Get dependencies - driver
        run: flutter pub get
        working-directory: ./apps/driver

      - name: Run analyzer
        run: flutter analyze
        working-directory: ./apps/driver

      - name: Check formatting
        run: dart format --set-exit-if-changed .
        working-directory: ./apps/driver

  test-core:
    name: Test mobi_core Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./packages/mobi_core

      - name: Run tests
        run: flutter test --coverage
        working-directory: ./packages/mobi_core

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./packages/mobi_core/coverage/lcov.info
          flags: mobi_core
          name: mobi-core-coverage

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze-passenger, analyze-driver]

    strategy:
      matrix:
        app: [passenger, driver]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies - mobi_core
        run: flutter pub get
        working-directory: ./packages/mobi_core

      - name: Get dependencies - ${{ matrix.app }}
        run: flutter pub get
        working-directory: ./apps/${{ matrix.app }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./apps/${{ matrix.app }}

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: [analyze-passenger, analyze-driver]
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        app: [passenger, driver]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies - mobi_core
        run: flutter pub get
        working-directory: ./packages/mobi_core

      - name: Get dependencies - ${{ matrix.app }}
        run: flutter pub get
        working-directory: ./apps/${{ matrix.app }}

      - name: Build iOS (without signing)
        run: flutter build ios --release --no-codesign
        working-directory: ./apps/${{ matrix.app }}
