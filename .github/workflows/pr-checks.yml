name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # ============================================
  # Job 1: PR Title & Description Validation
  # ============================================
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ✅ Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            O título do PR deve começar com letra maiúscula.
            Exemplo: "feat: Adicionar autenticação OAuth"

      - name: ✅ Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.body || pr.body.length < 20) {
              core.setFailed('❌ PR description is too short. Please provide a detailed description.');
            }

  # ============================================
  # Job 2: Code Quality Checks
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies - mobi_core
        working-directory: packages/mobi_core
        run: flutter pub get

      - name: 📦 Install dependencies - mobi_passenger
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 🔍 Run Dart analyzer
        run: |
          cd packages/mobi_core && flutter analyze || CORE_FAILED=1
          cd ../../apps/mobi_passenger && flutter analyze || PASSENGER_FAILED=1

          if [ "$CORE_FAILED" = "1" ] || [ "$PASSENGER_FAILED" = "1" ]; then
            echo "❌ Analyzer found issues"
            exit 1
          fi

      - name: ✅ Check code formatting
        run: |
          cd packages/mobi_core
          dart format --set-exit-if-changed lib test || CORE_FORMAT_FAILED=1

          cd ../../apps/mobi_passenger
          dart format --set-exit-if-changed lib test || PASSENGER_FORMAT_FAILED=1

          if [ "$CORE_FORMAT_FAILED" = "1" ] || [ "$PASSENGER_FORMAT_FAILED" = "1" ]; then
            echo "❌ Code is not formatted correctly"
            echo "Run: dart format lib test"
            exit 1
          fi

      - name: 📊 Code metrics
        run: |
          cd packages/mobi_core
          echo "## 📊 Code Metrics - mobi_core" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dart files | $(find lib -name '*.dart' | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Test files | $(find test -name '*_test.dart' 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines of code | $(find lib -name '*.dart' -exec cat {} \; | wc -l) |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 3: Changed Files Analysis
  # ============================================
  changed-files:
    name: Changed Files Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: |
            packages/mobi_core/**/*.dart
            apps/mobi_passenger/**/*.dart
            backend/**/*.php

      - name: 📊 Analyze changes
        run: |
          echo "## 📝 Changed Files Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]]; then
            echo "### Modified files:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.changed-files.outputs.all_changed_files }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Total: ${{ steps.changed-files.outputs.all_changed_files_count }} files" >> $GITHUB_STEP_SUMMARY
          else
            echo "No relevant files changed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ⚠️ Check for large PRs
        run: |
          CHANGED_COUNT=${{ steps.changed-files.outputs.all_changed_files_count }}
          if [ "$CHANGED_COUNT" -gt 50 ]; then
            echo "::warning::This PR changes $CHANGED_COUNT files. Consider splitting into smaller PRs."
          fi

  # ============================================
  # Job 4: Test Coverage Check
  # ============================================
  coverage-check:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: packages/mobi_core
        run: flutter pub get

      - name: 🧪 Run tests with coverage
        working-directory: packages/mobi_core
        run: flutter test --coverage

      - name: 📊 Coverage Report
        uses: VeryGoodOpenSource/very_good_coverage@v2
        with:
          path: packages/mobi_core/coverage/lcov.info
          min_coverage: 70
          exclude: |
            **/*.g.dart
            **/*.freezed.dart
            **/generated/**

      - name: 💬 Comment coverage on PR
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: packages/mobi_core/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

  # ============================================
  # Job 5: Dependency Audit
  # ============================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 📦 Install dependencies
        working-directory: packages/mobi_core
        run: flutter pub get

      - name: 🔍 Check for outdated dependencies
        working-directory: packages/mobi_core
        run: |
          flutter pub outdated --json > outdated.json || true

          if [ -s outdated.json ]; then
            echo "## 📦 Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`flutter pub outdated\` to see details" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔒 Check for vulnerable dependencies
        working-directory: packages/mobi_core
        run: |
          # This will be used when dart pub audit is available
          echo "Dependency audit completed" > /dev/null

  # ============================================
  # Job 6: Size Analysis (Android)
  # ============================================
  size-analysis:
    name: APK Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: contains(github.event.pull_request.labels.*.name, 'performance')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: apps/mobi_passenger
        run: flutter pub get

      - name: 🔨 Build APK
        working-directory: apps/mobi_passenger
        run: flutter build apk --debug --target-platform android-arm64

      - name: 📊 Analyze APK size
        run: |
          APK_PATH="apps/mobi_passenger/build/app/outputs/flutter-apk/app-debug.apk"
          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1048576" | bc)

          echo "## 📦 APK Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK Size: **${APK_SIZE_MB} MB**" >> $GITHUB_STEP_SUMMARY

          if (( $(echo "$APK_SIZE_MB > 50" | bc -l) )); then
            echo "::warning::APK size is large (${APK_SIZE_MB} MB). Consider optimizing."
          fi

  # ============================================
  # Job 7: Final PR Summary
  # ============================================
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [validate-pr, code-quality, coverage-check]
    if: always()

    steps:
      - name: 📊 Generate summary
        run: |
          echo "## ✅ PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR Validation | ${{ needs.validate-pr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Coverage | ${{ needs.coverage-check.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: ✅ All checks passed
        if: needs.validate-pr.result == 'success' && needs.code-quality.result == 'success' && needs.coverage-check.result == 'success'
        run: echo "✅ All PR checks passed!"

      - name: ❌ Some checks failed
        if: needs.validate-pr.result != 'success' || needs.code-quality.result != 'success' || needs.coverage-check.result != 'success'
        run: |
          echo "❌ Some PR checks failed. Please review the errors above."
          exit 1
